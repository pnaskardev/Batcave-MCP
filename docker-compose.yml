# Production stack. TLS is terminated by something in front of this — a Caddy or nginx already
# installed on the host, or an ALB. See README, "Running it on EC2".
# For local development use docker-compose.dev.yml, which brings its own Postgres.
#
#   export DB_URL='postgres://user:pass@host/db?sslmode=require'
#   export MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
#   docker compose up -d --build

services:
  mcp:
    build:
      context: .
      target: runtime
    image: batcave-mcp
    restart: unless-stopped
    # Loopback only — whatever terminates TLS on this host reaches it here. The app speaks
    # plaintext HTTP and authenticates with a bearer token, so it must never be published
    # on 0.0.0.0.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DB_URL: ${DB_URL:?set DB_URL to your Postgres connection string}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN; generate one with openssl rand -hex 32}
    healthcheck:
      test: ["CMD", "bun", "--eval", "await fetch('http://127.0.0.1:3000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
